[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "joescars-onedrive-mcp"
version = "0.1.2"
description = "Read-only MCP server for personal Microsoft OneDrive accounts"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joe Raio" }]
keywords = ["mcp", "onedrive", "microsoft-graph", "read-only"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet",
  "Topic :: Office/Business",
]
dependencies = [
  "mcp>=1.2.0,<2.0.0",
  "msal>=1.28.0",
  "requests>=2.31.0",
  "python-dotenv>=1.0.1",
  "filelock>=4.2.1",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0", "responses>=0.25.0"]

[project.urls]
Homepage = "https://github.com/joescars/onedrive-mcp"
Repository = "https://github.com/joescars/onedrive-mcp"
Issues = "https://github.com/joescars/onedrive-mcp/issues"

[project.scripts]
onedrive-mcp = "server:main"
onedrive-mcp-setup = "onedrive_mcp_setup:main"

[tool.setuptools]
py-modules = ["auth", "graph_client", "server", "onedrive_mcp_setup"]
